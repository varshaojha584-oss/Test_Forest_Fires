<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FWI Result</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
        }

        .result {
            font-size: 30px;
            color: #ff4d4d;
            margin: 20px 0;
        }

        a {
            text-decoration: none;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2> FWI Prediction Result</h2>

    <div class="result">
        {{ result }}
    </div>

    
</div>

</body>
</html>
